    <linearGradient id="s1" x1="0" x2="1"><stop offset="0" stop-color="#ff4fa0"/><stop offset=".5" stop-color="#ffb000"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
    <linearGradient id="s2" x1="0" x2="1"><stop offset="0" stop-color="#2bd4c0"/><stop offset="1" stop-color="#7a5cff"/></linearGradient>
    <linearGradient id="s3" x1="0" x2="1"><stop offset="0" stop-color="#ffe14a"/><stop offset="1" stop-color="#ff7a45"/></linearGradient>
    <path id="spark" d="M0-40 C4-10 10-4 40 0 C10 4 4 10 0 40 C-4 10 -10 4 -40 0 C-10-4 -4-10 0-40Z"/>
